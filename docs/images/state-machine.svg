<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 610" width="1300" height="610" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222222">
<title>Green Lantern power battery - firmware state machine</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
<marker id="arrGy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d2a"/></marker>
<marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f77f00"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62828"/></marker>
</defs>
<rect x="0" y="0" width="1300" height="610" fill="#ffffff"/>
<text x="20" y="32" font-size="20" text-anchor="start" font-weight="bold" fill="#222222">Firmware state machine — green_lantern.ino (hold-to-pour)</text>
<text x="20" y="52" font-size="11" text-anchor="start" font-weight="normal" fill="#555">loop() at ~100 Hz: readInputs() → pumpService() → global ring interlock → state switch → lightService()</text>
<rect x="30" y="150" width="136" height="182" rx="8" fill="#eeeeee" stroke="#222222" stroke-width="1.6"/>
<text x="98.0" y="174" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">IDLE</text>
<path d="M40,183 L156,183" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="200.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">light: dark</text>
<text x="40" y="212.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">(or the idle glow</text>
<text x="40" y="225.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">if you set one)</text>
<path d="M40,268 L156,268" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<text x="40" y="283" font-size="10" text-anchor="start" font-weight="normal" fill="#444">pump: OFF</text>
<rect x="202" y="150" width="136" height="182" rx="8" fill="#e3f2e3" stroke="#222222" stroke-width="1.6"/>
<text x="270.0" y="174" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">ARMED</text>
<path d="M212,183 L328,183" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="212" y="200.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">light: fades up</text>
<text x="212" y="212.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">to ~15 %</text>
<path d="M212,268 L328,268" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<text x="212" y="283" font-size="10" text-anchor="start" font-weight="normal" fill="#444">pump: OFF</text>
<rect x="374" y="150" width="136" height="182" rx="8" fill="#c8e6c9" stroke="#222222" stroke-width="1.6"/>
<text x="442.0" y="174" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">POURING</text>
<path d="M384,183 L500,183" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="384" y="200.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">light: climbs</text>
<text x="384" y="212.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">steadily from 15 %</text>
<text x="384" y="225.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">to 90 % over the</text>
<text x="384" y="237.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">pour (pourMs)</text>
<path d="M384,268 L500,268" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<text x="384" y="283" font-size="10" text-anchor="start" font-weight="bold" fill="#f77f00">pump: ON at the</text>
<text x="384" y="295" font-size="10" text-anchor="start" font-weight="bold" fill="#f77f00">speed setting, soft</text>
<text x="384" y="307" font-size="10" text-anchor="start" font-weight="bold" fill="#f77f00">start, runs pourMs,</text>
<text x="384" y="319" font-size="10" text-anchor="start" font-weight="bold" fill="#f77f00">20 s hard cap</text>
<rect x="546" y="150" width="136" height="182" rx="8" fill="#b9dfba" stroke="#222222" stroke-width="1.6"/>
<text x="614.0" y="174" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">HOLDING</text>
<path d="M556,183 L672,183" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="556" y="200.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">light: steady 90 %</text>
<path d="M556,268 L672,268" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<text x="556" y="283" font-size="10" text-anchor="start" font-weight="normal" fill="#444">pump: OFF (pour</text>
<text x="556" y="295" font-size="10" text-anchor="start" font-weight="normal" fill="#444">complete), waiting</text>
<text x="556" y="307" font-size="10" text-anchor="start" font-weight="normal" fill="#444">for the release</text>
<rect x="718" y="150" width="136" height="182" rx="8" fill="#f1fff1" stroke="#222222" stroke-width="1.6"/>
<text x="786.0" y="174" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">FINALE</text>
<path d="M728,183 L844,183" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="728" y="200.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">light: swells to</text>
<text x="728" y="212.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">100 % (0.4 s), holds</text>
<text x="728" y="225.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">0.3 s, fades out</text>
<text x="728" y="237.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">over 1.2 s</text>
<path d="M728,268 L844,268" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<text x="728" y="283" font-size="10" text-anchor="start" font-weight="normal" fill="#444">pump: OFF</text>
<rect x="890" y="150" width="136" height="182" rx="8" fill="#e6e6e6" stroke="#222222" stroke-width="1.6"/>
<text x="958.0" y="174" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">LOCKED</text>
<path d="M900,183 L1016,183" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="900" y="200.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">light: dark</text>
<path d="M900,268 L1016,268" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<text x="900" y="283" font-size="10" text-anchor="start" font-weight="normal" fill="#444">pump: OFF until the</text>
<text x="900" y="295" font-size="10" text-anchor="start" font-weight="normal" fill="#444">ring is removed</text>
<path d="M166,195 L201,195" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="184.0" y="84" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">ring in</text>
<text x="184.0" y="96" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">≥ 100 ms</text>
<path d="M184.0,100 L184.0,189" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<path d="M338,195 L373,195" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="356.0" y="84" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">twist held ≥ 40 ms,</text>
<text x="356.0" y="96" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">ring in, no pour</text>
<text x="356.0" y="108" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">yet → pump on</text>
<path d="M356.0,112 L356.0,189" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<path d="M510,195 L545,195" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="528.0" y="84" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">pourMs done</text>
<text x="528.0" y="96" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">(or 20 s cap)</text>
<path d="M528.0,100 L528.0,189" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<path d="M682,195 L717,195" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="700.0" y="84" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">ring turned back</text>
<text x="700.0" y="96" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">(switch released)</text>
<path d="M700.0,100 L700.0,189" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<path d="M854,195 L889,195" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="872.0" y="84" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">swell + fade</text>
<text x="872.0" y="96" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">done (1.9 s)</text>
<path d="M872.0,100 L872.0,189" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<path d="M486,332 L486,356 L748,356 L748,333" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrB)"/>
<text x="616.0" y="371" font-size="10" text-anchor="middle" font-weight="normal" fill="#1d4ed8">let go early: the pump stops where it is,</text>
<text x="616.0" y="383" font-size="10" text-anchor="middle" font-weight="normal" fill="#1d4ed8">the light swells ~10 % and fades out</text>
<path d="M958,332 L958,394 L125,394 L125,333" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="950" y="408" font-size="10" text-anchor="end" font-weight="normal" fill="#222222">ring removed ≥ 200 ms: only a</text>
<text x="950" y="420" font-size="10" text-anchor="end" font-weight="normal" fill="#222222">removed ring re-arms the prop</text>
<path d="M394,332 L394,432" fill="none" stroke="#d62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4"/>
<path d="M566,332 L566,432" fill="none" stroke="#d62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4"/>
<path d="M738,332 L738,432" fill="none" stroke="#d62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4"/>
<path d="M394,432 L920,432 L920,333" fill="none" stroke="#d62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
<rect x="330" y="440" width="470" height="22" rx="11" fill="#fdecea" stroke="#d62828" stroke-width="1"/>
<text x="565" y="455" font-size="11" text-anchor="middle" font-weight="bold" fill="#d62828">ring pulled out: pump off within 60 ms → LOCKED (from ARMED: back to IDLE)</text>
<path d="M98,110 L98,149" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="104" y="125" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">boot</text>
<rect x="1060" y="72" width="220" height="390" rx="8" fill="#fffbe6" stroke="#c9a227" stroke-width="1.4"/>
<text x="1170.0" y="94" font-size="13" text-anchor="middle" font-weight="bold" fill="#222222">Safety interlocks</text>
<path d="M1072,102 L1268,102" fill="none" stroke="#c9a227" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="1076" cy="116" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="1086" y="120.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Pump pin driven LOW first</text>
<text x="1086" y="131.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">thing in setup(), before</text>
<text x="1086" y="143.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">anything else.</text>
<circle cx="1076" cy="157.5" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="1086" y="161.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Switch alone never pumps;</text>
<text x="1086" y="173.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Hall alone never pumps.</text>
<circle cx="1076" cy="187.5" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="1086" y="191.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Dead-man: the pump runs</text>
<text x="1086" y="203.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">only while the twist is held.</text>
<circle cx="1076" cy="217.5" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="1086" y="221.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Exactly one pour per ring</text>
<text x="1086" y="233.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">insertion (pouredThis-</text>
<text x="1086" y="244.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Insertion flag).</text>
<circle cx="1076" cy="259.0" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="1086" y="263.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Ring removed at any time</text>
<text x="1086" y="274.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">→ pump off at once (checked</text>
<text x="1086" y="286.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">every loop, outside states).</text>
<circle cx="1076" cy="300.5" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="1086" y="304.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Absolute cap MAX_PUMP_MS</text>
<text x="1086" y="316.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">= 20 s inside pumpService(),</text>
<text x="1086" y="327.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">independent of the states.</text>
<circle cx="1076" cy="342.0" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="1086" y="346.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Switch already pressed at</text>
<text x="1086" y="357.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">boot (jammed cam) is ignored</text>
<text x="1086" y="369.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">until it is released.</text>
<circle cx="1076" cy="383.5" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="1086" y="387.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Debounce: Hall 100 ms in /</text>
<text x="1086" y="399.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">200 ms out; switch 40 ms.</text>
<circle cx="1076" cy="413.5" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="1086" y="417.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Hardware: 10 k pull-downs</text>
<text x="1086" y="429.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">hold both MOSFETs off</text>
<text x="1086" y="440.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">while the XIAO boots.</text>
<rect x="30" y="470" width="1010" height="120" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
<text x="44" y="491" font-size="12" text-anchor="start" font-weight="bold" fill="#222222">Timing constants</text>
<text x="44" y="509" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">HALL_DEBOUNCE_MS 100   ·   RING_GONE_MS 200   ·   POUR_ABORT_MS 60   ·   SWITCH_DEBOUNCE_MS 40   ·   PUMP_RAMP_MS 300   ·   MAX_PUMP_MS 20 000</text>
<text x="44" y="523" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">DEFAULT_POUR_MS 11 000 (the length of the build-up)   ·   DEFAULT_PUMP_SPEED 70 % (sets the volume: calibrate)</text>
<text x="44" y="537" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">Light: ARMED_LEVEL 15 %   ·   POUR_PEAK 90 %   ·   EARLY_BUMP +10 %   ·   finale 0.4 s up, 0.3 s hold, 1.2 s fade   ·   idle glow 0</text>
<text x="44" y="565" font-size="11" text-anchor="start" font-weight="bold" fill="#222222">Bench (USB serial, 115200):</text>
<text x="210" y="565" font-size="10" text-anchor="start" font-weight="normal" fill="#222222" font-family="Menlo, Consolas, monospace">status  ·  cal 10000  ·  pour 11000  ·  speed 70  ·  leds 255  ·  idle 0  ·  vcal 12.31  ·  save  ·  stop</text>
<text x="44" y="582" font-size="10" text-anchor="start" font-weight="bold" fill="#222222">Legend:</text>
<path d="M100,578 L130,578" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="136" y="582" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">transition</text>
<path d="M210,578 L240,578" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrB)"/>
<text x="246" y="582" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">early release</text>
<path d="M330,578 L360,578" fill="none" stroke="#d62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
<text x="366" y="582" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">ring pulled out</text>
</svg>

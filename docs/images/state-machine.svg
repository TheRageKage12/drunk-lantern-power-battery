<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#222222">
<title>Green Lantern power battery - firmware state machine</title>
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
<marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7c3aed"/></marker>
<marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker>
<marker id="arrGy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#777777"/></marker>
<marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a9d2a"/></marker>
<marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker>
<marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f77f00"/></marker>
<marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#d62828"/></marker>
</defs>
<rect x="0" y="0" width="1100" height="600" fill="#ffffff"/>
<text x="20" y="32" font-size="20" text-anchor="start" font-weight="bold" fill="#222222">Firmware state machine — green_lantern.ino</text>
<text x="20" y="52" font-size="11" text-anchor="start" font-weight="normal" fill="#555">loop() at ~100 Hz: readInputs() → pumpService() → global ring interlock → state switch → show()</text>
<rect x="30" y="150" width="136" height="182" rx="8" fill="#eeeeee" stroke="#222222" stroke-width="1.6"/>
<text x="98.0" y="174" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">IDLE</text>
<path d="M40,183 L156,183" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="40" y="200.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">LEDs: faint green</text>
<text x="40" y="212.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">ember, 6–13/255,</text>
<text x="40" y="225.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">4 s breathe (never</text>
<text x="40" y="237.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">looks dead)</text>
<path d="M40,268 L156,268" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<text x="40" y="283" font-size="10" text-anchor="start" font-weight="normal" fill="#444">pump: OFF</text>
<rect x="205" y="150" width="136" height="182" rx="8" fill="#e3f2e3" stroke="#222222" stroke-width="1.6"/>
<text x="273.0" y="174" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">ARMED</text>
<path d="M215,183 L331,183" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="215" y="200.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">LEDs: slow charging</text>
<text x="215" y="212.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">pulse, 1.6 s period;</text>
<text x="215" y="225.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">ceiling 90→170 over</text>
<text x="215" y="237.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">20 s; one bright</text>
<text x="215" y="250.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">pixel orbits the ring</text>
<path d="M215,268 L331,268" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<text x="215" y="283" font-size="10" text-anchor="start" font-weight="normal" fill="#444">pump: OFF</text>
<rect x="380" y="150" width="136" height="182" rx="8" fill="#f1fff1" stroke="#222222" stroke-width="1.6"/>
<text x="448.0" y="174" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">FLASH</text>
<path d="M390,183 L506,183" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="390" y="200.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">LEDs: ring + strip</text>
<text x="390" y="212.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">full white-green</text>
<text x="390" y="225.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">flash for 220 ms</text>
<path d="M390,268 L506,268" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<text x="390" y="283" font-size="10" text-anchor="start" font-weight="normal" fill="#444">pump: OFF</text>
<text x="390" y="295" font-size="10" text-anchor="start" font-weight="normal" fill="#444">(starts on exit)</text>
<rect x="555" y="150" width="136" height="182" rx="8" fill="#c8e6c9" stroke="#222222" stroke-width="1.6"/>
<text x="623.0" y="174" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">POURING</text>
<path d="M565,183 L681,183" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="565" y="200.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">strip: bright green</text>
<text x="565" y="212.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">swirl (120–255);</text>
<text x="565" y="225.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">ring: breathing +</text>
<text x="565" y="237.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">6-px comet head</text>
<path d="M565,268 L681,268" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<text x="565" y="283" font-size="10" text-anchor="start" font-weight="bold" fill="#f77f00">pump: ON — PWM</text>
<text x="565" y="295" font-size="10" text-anchor="start" font-weight="bold" fill="#f77f00">ramp 40→255 in</text>
<text x="565" y="307" font-size="10" text-anchor="start" font-weight="bold" fill="#f77f00">300 ms, runs pourMs,</text>
<text x="565" y="319" font-size="10" text-anchor="start" font-weight="bold" fill="#f77f00">hard cap 20 s</text>
<rect x="730" y="150" width="136" height="182" rx="8" fill="#dcedc8" stroke="#222222" stroke-width="1.6"/>
<text x="798.0" y="174" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222">LOCKED</text>
<path d="M740,183 L856,183" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<text x="740" y="200.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">LEDs: afterglow</text>
<text x="740" y="212.5" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">200→60 over 4 s,</text>
<text x="740" y="225.0" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">then steady 60</text>
<path d="M740,268 L856,268" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<text x="740" y="283" font-size="10" text-anchor="start" font-weight="normal" fill="#444">pump: OFF; stays</text>
<text x="740" y="295" font-size="10" text-anchor="start" font-weight="normal" fill="#444">locked until the</text>
<text x="740" y="307" font-size="10" text-anchor="start" font-weight="normal" fill="#444">ring is removed</text>
<path d="M166,195 L204,195" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="185.5" y="84" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">ring present</text>
<text x="185.5" y="96" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">≥ 100 ms</text>
<text x="185.5" y="108" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">(Hall LOW)</text>
<path d="M185.5,112 L185.5,189" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<path d="M341,195 L379,195" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="360.5" y="84" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">ring AND switch</text>
<text x="360.5" y="96" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">(cam at ~40°) AND</text>
<text x="360.5" y="108" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">not poured yet</text>
<path d="M360.5,112 L360.5,189" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<path d="M516,195 L554,195" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="535.5" y="84" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">after 220 ms:</text>
<text x="535.5" y="96" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">pumpStart(pourMs)</text>
<path d="M535.5,100 L535.5,189" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<path d="M691,195 L729,195" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="710.5" y="84" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">pour done</text>
<text x="710.5" y="96" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">(pourMs elapsed</text>
<text x="710.5" y="108" font-size="10" text-anchor="middle" font-weight="normal" fill="#222222">or 20 s cap hit)</text>
<path d="M710.5,112 L710.5,189" fill="none" stroke="#999" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2,2"/>
<path d="M790,332 L790,362 L125,362 L125,333" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="785" y="374" font-size="10" text-anchor="end" font-weight="normal" fill="#222222">ring absent ≥ 200 ms:</text>
<text x="785" y="386" font-size="10" text-anchor="end" font-weight="normal" fill="#222222">only a removed ring re-arms the prop</text>
<path d="M235,332 L235,404" fill="none" stroke="#d62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4"/>
<path d="M410,332 L410,404" fill="none" stroke="#d62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4"/>
<path d="M585,332 L585,404" fill="none" stroke="#d62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4"/>
<path d="M585,404 L70,404 L70,333" fill="none" stroke="#d62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
<rect x="290" y="410" width="420" height="22" rx="11" fill="#fdecea" stroke="#d62828" stroke-width="1"/>
<text x="500" y="425" font-size="11" text-anchor="middle" font-weight="bold" fill="#d62828">ABORT: ring absent ≥ 200 ms in any state → pumpStop() → IDLE</text>
<path d="M98,110 L98,149" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="104" y="125" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">boot</text>
<rect x="890" y="72" width="195" height="360" rx="8" fill="#fffbe6" stroke="#c9a227" stroke-width="1.4"/>
<text x="987.5" y="94" font-size="13" text-anchor="middle" font-weight="bold" fill="#222222">Safety interlocks</text>
<path d="M902,102 L1073,102" fill="none" stroke="#c9a227" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="906" cy="116" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="916" y="120.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Pump pin driven LOW first</text>
<text x="916" y="131.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">thing in setup(), before</text>
<text x="916" y="143.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">anything else.</text>
<circle cx="906" cy="157.5" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="916" y="161.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Switch alone never pumps;</text>
<text x="916" y="173.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Hall alone never pumps.</text>
<circle cx="906" cy="187.5" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="916" y="191.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Exactly one pour per ring</text>
<text x="916" y="203.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">insertion (pouredThis-</text>
<text x="916" y="214.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Insertion flag).</text>
<circle cx="906" cy="229.0" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="916" y="233.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Ring removed at any time</text>
<text x="916" y="244.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">→ pump off at once (checked</text>
<text x="916" y="256.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">every loop, outside states).</text>
<circle cx="906" cy="270.5" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="916" y="274.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Absolute cap MAX_PUMP_MS</text>
<text x="916" y="286.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">= 20 s inside pumpService(),</text>
<text x="916" y="297.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">independent of the states.</text>
<circle cx="906" cy="312.0" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="916" y="316.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Switch already pressed at</text>
<text x="916" y="327.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">boot (jammed cam) is ignored</text>
<text x="916" y="339.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">until it is released.</text>
<circle cx="906" cy="353.5" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="916" y="357.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Debounce: Hall 100 ms in /</text>
<text x="916" y="369.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">200 ms out; switch 40 ms.</text>
<circle cx="906" cy="383.5" r="3" fill="#c9a227" stroke="none" stroke-width="1.2"/>
<text x="916" y="387.5" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">Hardware: master switch,</text>
<text x="916" y="399.0" font-size="9.5" text-anchor="start" font-weight="normal" fill="#222222">fuses on 5 V and 12 V.</text>
<rect x="30" y="455" width="836" height="120" rx="8" fill="#f5f5f5" stroke="#bbb" stroke-width="1"/>
<text x="44" y="476" font-size="12" text-anchor="start" font-weight="bold" fill="#222222">Timing constants</text>
<text x="44" y="494" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">HALL_DEBOUNCE_MS 100   ·   RING_GONE_MS 200   ·   SWITCH_DEBOUNCE_MS 40   ·   FLASH_MS 220   ·   PUMP_RAMP_MS 300</text>
<text x="44" y="508" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">DEFAULT_POUR_MS 10 000 (replace after water calibration; a 44 mL shot at 200 mL/min ≈ 13 s)   ·   MAX_PUMP_MS 20 000</text>
<text x="44" y="522" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">DEFAULT_MAX_BRIGHT 160/255 (current budget for 84 pixels)</text>
<text x="44" y="550" font-size="11" text-anchor="start" font-weight="bold" fill="#222222">Bench (USB serial, 115200):</text>
<text x="210" y="550" font-size="10" text-anchor="start" font-weight="normal" fill="#222222" font-family="Menlo, Consolas, monospace">status  ·  cal 10000 (pump for 10 s without the ring)  ·  pour 13000  ·  leds 160  ·  save  ·  stop</text>
<text x="44" y="567" font-size="10" text-anchor="start" font-weight="bold" fill="#222222">Legend:</text>
<path d="M100,563 L130,563" fill="none" stroke="#222222" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrK)"/>
<text x="136" y="567" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">transition</text>
<path d="M210,563 L240,563" fill="none" stroke="#d62828" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#arrR)"/>
<text x="246" y="567" font-size="10" text-anchor="start" font-weight="normal" fill="#222222">abort path (ring pulled)</text>
</svg>

<style>
/* Layout: a workbench. The 3D model fills the bench; a parts-tray panel on the right holds the steps and the parts list. */
:root {
  --bg: #e9ede8;          /* bench top, faintly green-grey */
  --stage: #f4f6f2;       /* 3D background */
  --panel: #fbfcfa;
  --ink: #16211b;
  --muted: #5b6a61;

  --accent: #178a4a;      /* lantern green */

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1411; --stage: #131b17; --panel: #18211c; --ink: #e2ebe5; --muted: #93a49a;

:root[data-theme="dark"] {
  --bg: #0e1411; --stage: #131b17; --panel: #18211c; --ink: #e2ebe5; --muted: #93a49a;

[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0; }
.stage { position: relative; background: var(--stage); min-width: 0; min-height: 0; }
#view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
.stage-top { position: absolute; top: 12px; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px; display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; pointer-events: none; flex-wrap: wrap; }
.brand { pointer-events: auto; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; margin: 0; line-height: 1; text-wrap: balance; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 12.5px; }
.modes { pointer-events: auto; display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 3px; gap: 3px; }
.modes button { font: 600 13px var(--f-body); border: 0; background: transparent; color: var(--muted); padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.modes button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.stage-bottom { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); right: 16px; bottom: 14px; display: flex; gap: 10px; align-items: flex-end; justify-content: space-between; pointer-events: none; flex-wrap: wrap; }
.explode { pointer-events: auto; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; }
.explode label { font: 600 12px var(--f-body); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.explode input { width: 160px; accent-color: var(--accent); }
.hint { color: var(--muted); font-size: 12px; background: color-mix(in srgb, var(--panel) 80%, transparent); padding: 4px 8px; border-radius: 6px; }
.pick { pointer-events: auto; position: absolute; top: 72px; left: max(16px, env(safe-area-inset-left, 0px)); max-width: 300px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; box-shadow: 0 6px 18px rgba(0,0,0,.08); }
.pick h3 { margin: 0 0 2px; font: 600 14px var(--f-body); display: flex; align-items: center; gap: 8px; }
.pick code { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.pick p { margin: 6px 0 0; font-size: 13px; }
.pick button { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: var(--muted); font-size: 18px; cursor: pointer; }

.panel { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; padding-right: env(safe-area-inset-right, 0px); }
.tabs { display: flex; border-bottom: 1px solid var(--line); }

.scroll { overflow-y: auto; min-height: 0; flex: 1; padding: 14px 16px 18px; }

.stepnav button:disabled { opacity: .4; cursor: default; }
.stepnav .count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); margin-left: auto; font-variant-numeric: tabular-nums; }
.stage-label { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.step-title { font-family: var(--f-display); font-weight: 600; font-size: 28px; line-height: 1.05; margin: 2px 0 8px; text-wrap: balance; }
.step-body { margin: 0; padding-left: 18px; display: grid; gap: 6px; }
.step-body li { max-width: 62ch; }
.hw { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
.hw span { font-family: var(--f-mono); font-size: 11.5px; background: var(--chip); border-radius: 4px; padding: 3px 7px; }
.ref { margin-top: 10px; font-size: 12px; color: var(--muted); }
.newparts { margin-top: 14px; display: grid; gap: 4px; }
.newparts h4, .legend h4 { margin: 0 0 4px; font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.steplist { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 2px; }
.steplist button { text-align: left; font: 13px var(--f-body); background: none; border: 0; color: var(--ink); padding: 5px 6px; border-radius: 5px; cursor: pointer; display: grid; grid-template-columns: 26px 1fr; gap: 6px; }
.steplist button .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.steplist button[aria-current="step"] { background: var(--chip); font-weight: 600; }
.steplist .grp { font: 600 11px var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 8px 0 2px 6px; }

.prow { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center; padding: 4px 6px; border-radius: 5px; cursor: pointer; }
.prow:hover, .prow.hot { background: var(--chip); }
.sw { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); }
.sw.bought { background-image: repeating-linear-gradient(45deg, rgba(255,255,255,.45) 0 2px, transparent 2px 5px); }
.prow .nm { min-width: 0; }
.prow .nm small { display: block; font-family: var(--f-mono); font-size: 11px; color: var(--muted); overflow-wrap: anywhere; }
.prow input { accent-color: var(--accent); }
.legend { display: grid; gap: 14px; }
.legend .note { font-size: 12.5px; color: var(--muted); margin: 0; }
button:focus-visible, input:focus-visible, .prow:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.loading { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 13px; }

@media (max-width: 820px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: 58% 42%; }
  .panel { border-left: 0; border-top: 1px solid var(--line); padding-left: env(safe-area-inset-left, 0px); }
  .brand h1 { font-size: 21px; }
  .brand p, .hint { display: none; }
  .explode input { width: 110px; }
  .pick { top: auto; bottom: 64px; }
}

<script>
(() => {
// ---------------------------------------------------------------- parts: name, colour, group, explode offset (mm), notes[, opacity]
// Rev C (2026-10-23). Offsets move a part away from its built position when the view is spread; z is up,
// -y is the audience (front lens) side, +y is your (hand-opening) side.
// Colours follow the print colour: green shell (shades vary so neighbours read apart), white parts white,
// the inside parts dark green, the lock grey, bought parts as striped allowances.
const G = { shell: 'Lantern shell', top: 'Top cap and lid', bells: 'Bells', inside: 'Inside the sphere', lock: 'Lock', handle: 'Handle', cart: 'Cartridge', bought: 'Bought parts (size allowances)' };
const P = {
  base:            ['Drum', '#23693b', 'shell', [0,0,-140], 'Green. Printed upright. 3 bayonet lugs inside its bottom edge lock onto the cartridge; 3 × M3×8 through its top band into the foot.'],
  screw_cap:       ['Screw cap', '#2e7d48', 'shell', [0,32,-140], 'Green, print 25: 3 on the drum screws (shown), 18 on the handle lap heads and nuts, 4 on the pivot heads inside the sphere. Pressed in flush so no screw shows.'],
  foot:            ['Foot', '#2a7a45', 'shell', [0,0,-60], 'Green. Spigot into the drum; its riser carries the bay floor. 3 thumbscrews from inside its neck into the sphere\'s bottom collar.'],
  sphere_front:    ['Sphere front half', '#2e8b4e', 'shell', [0,-150,0], 'Green. Audience side, holds the front bell collar. Its bosses take the 4 M3×10 from the rear half\'s flange (M3 inserts).'],
  sphere_rear:     ['Sphere rear half', '#3fa45f', 'shell', [0,170,0], 'Green. Your side, hand opening and rear bell collar. 4 × M3×10 through its inner flange into the front half.'],
  handle_pivot_left:  ['Handle pivot (left)', '#4f9a36', 'handle', [-35,0,0], 'Green. 2 × M3×12 from inside the sphere into its inserts; green caps on the heads.'],
  handle_pivot_right: ['Handle pivot (right)', '#4f9a36', 'handle', [35,0,0], 'Green. 2 × M3×12 from inside the sphere into its inserts; green caps on the heads.'],
  handle_end_left:  ['Handle end (left)', '#5aa83a', 'handle', [-80,0,20], 'Green. Its axle goes into the left pivot.'],
  handle_end_right: ['Handle end (right)', '#5aa83a', 'handle', [80,0,20], 'Green. Its axle goes into the right pivot.'],
  handle_arc_1:     ['Handle arc 1', '#69b546', 'handle', [110,0,60], 'Green. Laps onto an end piece and the other arc: 3 × M3×8 + nuts per lap, epoxy, green caps.'],
  handle_arc_2:     ['Handle arc 2', '#69b546', 'handle', [-110,0,60], 'Green. Laps onto an end piece and the other arc: 3 × M3×8 + nuts per lap, epoxy, green caps.'],
  top_cap:         ['Top cap', '#35995a', 'top', [0,0,60], 'Green. Plugs into the sphere\'s top collar: 3 thumbscrews from inside its neck (lid and cap floor out).'],
  cap_floor:       ['Cap floor', '#1f4f36', 'top', [0,0,160], 'Inside part (any colour). Carries the battery, the board, the buck module, S1 and the charge socket. Sits on its ledge in the cap: 3 thumbscrews.'],
  halo_ring:       ['Halo ring', '#eef1ec', 'top', [0,0,200], 'White. The lid: push down and twist clockwise to lock (click); anticlockwise to lift off.'],
  emblem_lid:      ['Emblem lid', '#1f8a47', 'top', [0,0,230], 'Green. Glued onto the halo ring; two 1.75 mm filament pins line it up.'],
  emblem_centre:   ['Emblem centre', '#2fa859', 'top', [0,0,245], 'Green. Glued in the emblem; the emblem_jig centres it.'],
  bell_front:      ['Front bell', '#47b06a', 'bells', [0,-360,0], 'Green. LED ring in its collar band, diffuser in its pocket. Slides onto the front collar: 2 thumbscrews from inside the sphere.'],
  diffuser:        ['Front lens diffuser', '#f4f7f5', 'bells', [0,-290,0], 'White, frosted, 118 mm. Pressed into the front bell\'s pocket.', 0.8],
  bell_rear:       ['Rear bell', '#3a9c5c', 'bells', [0,370,0], 'Green. LED ring inside, the one-piece cover and clamp ring at its mouth. 2 thumbscrews from inside the sphere.'],
  curtain_clamp:   ['Cover clamp ring', '#4a9a5a', 'bells', [0,260,0], 'Green, full ring. Clamps the frosted cover at the rear bell\'s mouth: 4 countersunk M3×8 from inside the bell.'],
  lock_wall:       ['Lock wall', '#e6e9e2', 'inside', [0,0,10], 'White. 2 × 5 cm LED columns on its face; the lock bolts to it (2 × M3×10 + nuts). Two tabs into the bay floor\'s slots.'],
  led_panel:       ['LED panel', '#f1f3ef', 'inside', [0,-50,0], 'White. 4 × 10 cm LED rows on its front; its collars slip over the 4 posts on the lock wall, a dot of glue each.'],
  wall_extension:  ['Wall extension', '#dde2da', 'inside', [0,0,45], 'White. Fits onto the lock wall\'s top edge.'],
  bay_floor:       ['Bay floor', '#1d4a32', 'inside', [0,0,-8], 'Inside part. Sits on the foot\'s riser; glass well slot, grommet hole and the lock wall\'s two slots.'],
  guide_boss:      ['Nozzle insert boss', '#2a5c40', 'inside', [0,0,-30], 'Inside part. Glued under the bay floor; carries the M3 insert for the nozzle guide.'],
  glass_well:      ['Glass well', '#24553a', 'inside', [0,0,-20], 'Inside part. Drops into the bay floor\'s slot.'],
  nozzle_guide:    ['Nozzle guide', '#2f6a48', 'inside', [-60,0,15], 'Inside part. 1 × M3×8 into the guide boss insert; the tube is pressed into it.'],
  socket_housing:  ['Lock housing', '#8a9096', 'lock', [0,80,0], 'Grey in renders. Front plate of the lock.'],
  rotor:           ['Rotor', '#a9aeb3', 'lock', [0,55,0], 'Grey in renders. Turns 45° with the key ring; magnet inside.'],
  plunger:         ['Spring plunger', '#5e6469', 'lock', [-35,40,0], 'Grey in renders. Rides on the rotor ramp on its spring.'],
  switch_bracket:  ['Switch bracket', '#b8bdc1', 'lock', [-30,25,0], 'Grey in renders. Carries the microswitch.'],
  socket_base:     ['Lock base plate', '#70767c', 'lock', [0,10,0], 'Grey in renders. A3144 Hall sensor on its post; 3 × M3×8 flat-head close the lock, 1 more through the bracket.'],
  key_ring:        ['Lantern ring (key)', '#9aa0a5', 'lock', [0,130,0], 'Worn on the finger; its raised emblem is the key that turns the rotor. Magnet glued in.'],
  base_tray:       ['Cartridge', '#1b4430', 'cart', [0,0,-370], 'Inside part. One-piece floor with the bayonet collar, pump saddles and splash wall. Stays on the table at refill.'],
  bag_cover:       ['Bag cover', '#2c6044', 'cart', [0,0,-230], 'Inside part. Lies over the bag; lift it to take the bag out.'],
  pump_envelope:             ['Pump (allowance)', '#6d7e90', 'bought', [0,0,-280], 'KPHM200 on its saddles with one strap; tube on, plug up.'],
  bag_envelope:              ['Drink bag (allowance)', '#c9d9a8', 'bought', [0,0,-280], '32 oz spouted pouch lying flat in the bay, spout at the back-corner well.', 0.6],
  glass_envelope:            ['Shot glass (allowance)', '#cfe9f5', 'bought', [0,120,0], 'Up to 52 mm across and 62 mm tall, in the glass well under the nozzle.', 0.55],
  powerbank_envelope:        ['Battery', '#3b4a5c', 'bought', [0,0,165], 'On the cap floor, LED face down over the slot, under a strap.'],
  perfboard_envelope:        ['Electronics board', '#b98b4f', 'bought', [0,0,165], 'On its 4 standoffs on the cap floor, 4 × M3×6.'],
  board_components_envelope: ['Board components (allowance)', '#3e63a8', 'bought', [0,0,165], 'XIAO RP2040 and the board parts: the space they may use.'],
  buck_envelope:             ['Buck module', '#2f6aa0', 'bought', [0,0,165], 'On the cap floor. Set to 5.0 V first.'],
  power_switch_envelope:     ['Power switch S1', '#41484f', 'bought', [0,0,165], 'In its box on the cap floor; reached with the lid off.'],
  charge_socket_envelope:    ['Charge socket', '#545b62', 'bought', [0,0,165], 'Zip-tied on the cap floor; reached with the lid off.'],
  front_led_envelope:        ['Front bell LED ring', '#7fe39a', 'bought', [0,-260,0], 'Green COB strip, ~37.5 cm, inside the front bell\'s collar band.'],
  rear_led_envelope:         ['Rear bell LED ring', '#7fe39a', 'bought', [0,230,0], 'Green COB strip, ~45 cm full ring, inside the rear bell.'],
  cap_led_envelope:          ['Emblem LED strips', '#7fe39a', 'bought', [0,0,60], 'Green COB strip, 2 x 12.5 cm on the top cap\'s inner wall under the rim, facing in: they light the halo ring and the emblem.'],
  panel_led_envelope:        ['LED panel strips', '#7fe39a', 'bought', [0,-60,0], '4 × 10 cm green COB rows on the LED panel\'s front.'],
  curtain_envelope:          ['Hand-side cover', '#e3ebe5', 'bought', [0,285,0], 'Frosted polypropylene, 171 mm disc with 8 cuts from the centre; clamped at the rear bell\'s mouth.', 0.65],
};
// copies of one printed part (same STL, more places): name -> part it copies, and its own explode offset
const COPY = { screw_cap_2: ['screw_cap', [-28,-16,-140]], screw_cap_3: ['screw_cap', [28,-16,-140]] };
for (const [n, [src, off]] of Object.entries(COPY)) { P[n] = P[src].slice(); P[n][3] = off; }
const base = n => (COPY[n] ? COPY[n][0] : n);
const copiesOf = n => [n, ...Object.keys(COPY).filter(c => COPY[c][0] === n)];

const LOCK = ['socket_housing','rotor','plunger','switch_bracket','socket_base','key_ring'];
const CAPS = copiesOf('screw_cap');
const CAPFLOOR = ['cap_floor','powerbank_envelope','perfboard_envelope','board_components_envelope','buck_envelope','power_switch_envelope','charge_socket_envelope'];
const LID = ['halo_ring','emblem_lid','emblem_centre'];
const FRONT_BELL = ['bell_front','front_led_envelope','diffuser'];
const REAR_BELL = ['bell_rear','rear_led_envelope','curtain_envelope','curtain_clamp'];
const HANDLE = ['handle_end_left','handle_end_right','handle_arc_1','handle_arc_2'];
const CART = ['base_tray','pump_envelope','bag_envelope','bag_cover'];
const LANTERN = Object.keys(P).filter(n => !CART.includes(n));
const PRINTED = Object.keys(P).filter(n => P[n][2] !== 'bought');

// ---------------------------------------------------------------- steps (build order, rev C; same numbers and names as the build guide)
// track: parts from earlier steps of the same track (and of the tracks in ctx) stay on screen as faded context.
// hold: how far apart the step's parts stay (fraction of their explode offset). fly: a shared vector the parts fly in from.
const STEPS = [
 { n:0, stage:'Prepare', title:'Print everything and set the inserts', track:'print', ctx:[], parts:PRINTED, hold:1, view:[1,-0.8,0.4],
   body:['Print every part (green unless noted; white: diffuser, LED panel, halo ring, lock wall, wall extension).','Print thumb_test first and check which 6-32 hole (4.6 / 4.8 / 5.0 mm) grips the insert.','Melt in the 17 M3 inserts and the 13 6-32 inserts (one per thumbscrew).'],
   hw:['17 × M3 insert','13 × 6-32 insert','soldering iron'] },
 { n:1, stage:'Inside parts', title:'Lock', track:'lock', ctx:[], parts:LOCK, hold:0.6, view:[1,0.35,0.3],
   body:['Housing, rotor with its magnet, plunger and spring, switch bracket with the microswitch, the A3144 Hall sensor, then the base plate. Unchanged from rev 9.','Glue the magnet into the key ring.'],
   hw:['spring','microswitch','A3144','2 magnets','3 + 1 × M3×8 flat-head'] },
 { n:2, stage:'Inside parts', title:'Lock wall', track:'wall', ctx:['lock'], parts:['lock_wall'], view:[0.6,1,0.45],
   body:['Stick a 5 cm LED column either side of the lock on the wall\'s face.','Mount the lock: 2 × M3×10 through the ears and the wall, nuts behind.','Pass the leads through.'],
   hw:['2 × M3×10','2 × M3 nut','LED strip 2 × 5 cm'] },
 { n:3, stage:'Inside parts', title:'LED panel', track:'wall', ctx:['lock'], parts:['led_panel','panel_led_envelope'], view:[0.5,-1,0.35],
   body:['Stick the four 10 cm strips on the panel\'s front, leads through the holes at the row ends.','Slip its collars over the 4 posts on the back of the lock wall, a dot of glue each.'],
   hw:['LED strip 4 × 10 cm','super glue'] },
 { n:4, stage:'Inside parts', title:'Bay floor', track:'wall', ctx:['lock'], parts:['bay_floor','guide_boss','glass_well','nozzle_guide','glass_envelope'], view:[0.7,0.9,0.8],
   body:['Glue the guide boss under the floor. Drop the glass well into its slot.','Nozzle guide on the floor: 1 × M3×8 into the guide boss insert. Tube up through the grommet hole and pressed into the guide.','Lock wall\'s two tabs into the floor\'s slots.'],
   hw:['1 × M3×8','tube'] },
 { n:5, stage:'Lantern body', title:'Drum and foot', track:'body', ctx:[], parts:['base','foot',...CAPS], view:[0.8,-1,0.5],
   body:['Push the foot\'s spigot into the top of the drum.','3 × M3×8 from outside through the drum\'s top band into the spigot\'s inserts.','Press the 3 green caps over the heads.'],
   hw:['3 × M3×8','3 screw caps'] },
 { n:6, stage:'Lantern body', title:'Sphere', track:'body', ctx:['lock','wall'], parts:['sphere_front','sphere_rear'], view:[0.9,-1,0.45],
   body:['Set the bay floor assembly on the foot\'s riser.','Close the two sphere halves round it: 4 × M3×10 through the rear half\'s flange from inside.','3 thumbscrews from inside the foot\'s neck into the sphere\'s bottom collar.'],
   hw:['4 × M3×10','3 thumbscrews'] },
 { n:7, stage:'Lantern body', title:'Pivots', track:'body', ctx:['lock','wall'], parts:['handle_pivot_left','handle_pivot_right'], view:[1,-0.35,0.35],
   body:['On each side, 2 × M3×12 from inside the sphere into the pivot\'s inserts.','Green caps on the heads.'],
   hw:['4 × M3×12','4 screw caps'] },
 { n:8, stage:'Lantern body', title:'Wall extension', track:'body', ctx:['lock','wall'], parts:['wall_extension'], view:[0.5,1,0.8],
   body:['Fit the wall extension onto the lock wall\'s top edge.'],
   hw:[] },
 { n:9, stage:'Lantern body', title:'Top cap', track:'body', ctx:['lock','wall'], parts:['top_cap','cap_led_envelope'], view:[0.8,-1,0.6],
   body:['Stick the 2 emblem LED strips (12.5 cm each) on the cap\'s inner wall under the rim, front and back.','Plug the top cap into the sphere\'s top collar.','3 thumbscrews from inside its neck out into the collar\'s inserts.'],
   hw:['3 thumbscrews'] },
 { n:10, stage:'Lantern body', title:'Cap floor', track:'body', ctx:['lock','wall'], parts:CAPFLOOR, view:[0.35,-0.7,1.2],
   body:['Battery on its strap, LED face down over the slot. Board on its 4 standoffs (M3×6). Buck module. S1 in its box. Charge socket with zip ties.','Lead plugs up through the wire hole.','Drop the floor on its ledge in the cap: 3 thumbscrews.'],
   hw:['4 × M3×6','3 thumbscrews','1 strap','zip ties'] },
 { n:11, stage:'Lantern body', title:'Lid', track:'body', ctx:['lock','wall'], parts:LID, view:[0.5,-0.9,0.9],
   body:['Glue the emblem lid onto the white halo ring; two 1.75 mm filament pins line it up. The emblem jig centres the emblem centre.','Push the lid down and twist clockwise to lock (click).'],
   hw:['2 filament pins','glue'] },
 { n:12, stage:'Bells and handle', title:'Front bell', track:'body', ctx:['lock','wall'], parts:FRONT_BELL, view:[0.6,-1,0.3],
   body:['LED ring inside the collar band; press the diffuser into its pocket.','Slide the bell onto the front collar: 2 thumbscrews from inside (reach in through the hand opening, past the end of the lock wall).'],
   hw:['LED strip ~37.5 cm','2 thumbscrews'] },
 { n:13, stage:'Bells and handle', title:'Rear bell', track:'body', ctx:['lock','wall'], parts:REAR_BELL, view:[0.6,1,0.3],
   body:['LED ring inside.','One-piece cover and clamp ring at the mouth: 4 flat-head M3×8 from inside the bell.','Slide it on: 2 thumbscrews from inside, reaching in through the cover flaps.'],
   hw:['LED strip ~45 cm','4 × M3×8 flat-head','2 thumbscrews'] },
 { n:14, stage:'Bells and handle', title:'Handle', track:'body', ctx:['lock','wall'], parts:HANDLE, view:[0.4,-1,0.45],
   body:['End pieces\' axles into the pivots, then the two arcs.','3 laps × 3 M3×8 + nuts, with epoxy.','Green caps over the heads and nuts.'],
   hw:['9 × M3×8','9 × M3 nut','epoxy','18 screw caps'] },
 { n:15, stage:'Cartridge', title:'Cartridge', track:'cart', ctx:[], parts:CART, view:[0.5,-0.8,0.9],
   body:['Pump in its saddle with one strap; tube to the pump.','Bag (32 oz pouch) flat in the bay, spout at the back-corner well; tube end pressed into the clip at the well.','Bag cover on; pump plug up.'],
   hw:['1 strap','32 oz pouch'] },
 { n:16, stage:'Final', title:'Set the lantern on the cartridge', track:'final', ctx:['cart'], parts:LANTERN, fly:[0,0,240], view:[0.75,-1,0.4],
   body:['Join the pump plug.','Lower the lantern onto the cartridge and twist clockwise to lock.'],
   hw:[] },
];

// ---------------------------------------------------------------- DOM
const $ = id => document.getElementById(id);
const canvas = $('view');
let mode = 'steps', step = 0, spread = 1;

// ---------------------------------------------------------------- three.js scene
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 5, 20000);
camera.up.set(0, 0, 1);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.12;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a9a90, 0.75));
const key = new THREE.DirectionalLight(0xffffff, 0.65); key.position.set(-600, -900, 1200); scene.add(key);
const fill = new THREE.DirectionalLight(0xffffff, 0.3); fill.position.set(800, 600, 300); scene.add(fill);

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function applyTheme() { scene.background = new THREE.Color(cssVar('--stage') || '#f4f6f2'); }
applyTheme();
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

const objs = {};           // name -> { mesh, mat, home, off, info }
let parts = [];

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false);
  camera.aspect = r.width / Math.max(1, r.height); camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(canvas.parentElement);

Promise.resolve(window.MESH_B64).then(t => { const bin = atob(t); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); return u.buffer; }).then(buf => build(buf, window.MESH_INDEX))
  .catch(e => { $('loading').textContent = 'The model could not load. Reload the page to try again.'; console.error(e); });

function build(buf, idx) {
  for (const p of idx) {
    const info = P[p.name]; if (!info) continue;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(buf, p.v[0], p.v[1] * 3), 3));
    g.setIndex(new THREE.BufferAttribute(new Uint32Array(buf, p.i[0], p.i[1]), 1));
    g.computeVertexNormals();
    const mat = new THREE.MeshStandardMaterial({ color: info[1], roughness: 0.62, metalness: 0.02, side: THREE.DoubleSide });
    const mesh = new THREE.Mesh(g, mat);
    mesh.userData.name = p.name;
    scene.add(mesh);
    const edges = new THREE.LineSegments(new THREE.EdgesGeometry(g, 28), new THREE.LineBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18 }));
    mesh.add(edges);
    objs[p.name] = { mesh, mat, edges, off: new THREE.Vector3(...info[3]), pos: new THREE.Vector3(), cur: 0, target: 0, vis: 1, alpha: info[5] || 1, info, bbox: p.bbox };
    parts.push(p.name);
  }
  $('loading').hidden = true;
  buildLegend(); buildStepList(); setMode('steps', true); resize(); loop();
  window.viewer.ready = true;
}

// ---------------------------------------------------------------- state -> per-part targets
function stepSets(i) {
  const s = STEPS[i], focus = new Set(s.parts), ctx = new Set();
  const tracks = new Set([s.track, ...s.ctx]);
  for (let j = 0; j < i; j++) if (tracks.has(STEPS[j].track)) STEPS[j].parts.forEach(n => ctx.add(n));
  focus.forEach(n => ctx.delete(n));
  return { focus, ctx };
}
let animStart = 0;
function apply(resetCam) {
  const fresh = clock();
  if (mode === 'steps') {
    const { focus, ctx } = stepSets(step);
    for (const n of parts) {
      const o = objs[n];
      if (focus.has(n)) { o.state = 'focus'; o.cur = 1; o.target = 0; }
      else if (ctx.has(n)) { o.state = 'ctx'; o.target = 0; o.cur = 0; o.pos.set(0, 0, 0); }
      else { o.state = 'hidden'; }
    }
    animStart = fresh;
    if (resetCam) frame([...focus, ...ctx], 0, STEPS[step]);
  } else if (mode === 'pose') {
    for (const n of parts) objs[n].state = poseHide.has(n) ? 'hidden' : 'all';
  } else {
    for (const n of parts) { const o = objs[n]; o.state = 'all'; o.target = mode === 'explode' ? spread : 0; }
    if (resetCam) frame(parts, mode === 'explode' ? spread : 0);
  }
  styleAll();
  renderStepText();
}
function styleAll() {
  for (const n of parts) {
    const o = objs[n];
    const hidden = o.state === 'hidden' || !legendOn(n);
    o.mesh.visible = !hidden;
    const ctx = o.state === 'ctx';
    const a = ctx ? 0.16 : o.alpha;
    o.mat.transparent = a < 1; o.mat.opacity = a; o.mat.depthWrite = a >= 1;
    o.mat.color.set(ctx ? mixGrey(o.info[1]) : o.info[1]);
    o.edges.material.opacity = ctx ? 0.06 : 0.18;
    o.mat.emissive.set(n === hot ? 0x333333 : 0x000000);
  }
}
function mixGrey(hex) { const c = new THREE.Color(hex); return c.lerp(new THREE.Color(0xb9c2bc), 0.55); }

function frame(names, k = 0, st = null) {
  const box = new THREE.Box3();
  for (const n of names) { const o = objs[n]; if (!o) continue;
    const off = mode === 'pose' ? new THREE.Vector3(...(pose[n] || [0, 0, 0])) : o.off.clone().multiplyScalar(st && st.parts.includes(n) ? (st.hold || 0) : k);
    box.expandByPoint(new THREE.Vector3(...o.bbox[0]).add(off)); box.expandByPoint(new THREE.Vector3(...o.bbox[1]).add(off)); }
  if (box.isEmpty()) return;
  const c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length();
  const dist = size / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))) * (camera.aspect < 1 ? 1.45 : 1.05);
  const v = st && st.view ? st.view : (mode === 'explode' ? [1, 0.45, 0.3] : [0.55, 1.0, 0.55]);
  const dir = new THREE.Vector3(...v).normalize();   // default: from your side, slightly right and above
  camTo = { pos: c.clone().add(dir.multiplyScalar(dist)), tgt: c };
}
let camTo = null;

// ---------------------------------------------------------------- render loop
// Time-based, so the page animates the same at any frame rate; viewer.manual() lets a script drive the clock (videos).
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let manual = false, vnow = 0, last = performance.now(), spin = 0;
let pose = {}, poseHide = new Set();
const clock = () => (manual ? vnow : performance.now());
const ease = (rate, dt) => (reduce ? 1 : 1 - Math.pow(1 - rate, dt / 16.67));   // rate per 60 Hz frame
const goal = new THREE.Vector3();
function update(now, dt) {
  const a = ease(0.14, dt);
  for (const n of parts) {
    const o = objs[n];
    if (mode === 'steps' && o.state === 'focus') {
      const s = STEPS[step], t = reduce ? 1 : Math.min(1, (now - animStart - 250) / 900);
      const e = t <= 0 ? 0 : 1 - Math.pow(1 - t, 3), hold = s.hold || 0;
      if (s.fly) o.pos.copy(o.off).multiplyScalar(hold).addScaledVector(new THREE.Vector3(...s.fly), 1 - e);
      else o.pos.copy(o.off).multiplyScalar(hold + (1 - e) * 0.45);   // fly in from 45 % further out, settle at the step's spread
    } else {
      if (mode === 'pose') goal.set(...(pose[n] || [0, 0, 0])); else goal.copy(o.off).multiplyScalar(o.target);
      o.pos.lerp(goal, a);
    }
    o.mesh.position.copy(o.pos);
  }
  if (spin) {
    const ang = THREE.MathUtils.degToRad(spin) * dt / 1000, z = new THREE.Vector3(0, 0, 1);
    const tgt = camTo ? camTo.tgt : controls.target;
    camera.position.sub(tgt).applyAxisAngle(z, ang).add(tgt);
    if (camTo) camTo.pos.sub(camTo.tgt).applyAxisAngle(z, ang).add(camTo.tgt);
  }
  if (camTo) {
    const c = ease(0.1, dt);
    camera.position.lerp(camTo.pos, c); controls.target.lerp(camTo.tgt, c);
    if (camera.position.distanceTo(camTo.pos) < 1) camTo = null;
  }
  controls.update();
  renderer.render(scene, camera);
}
function loop() {
  requestAnimationFrame(loop);
  const t = performance.now(), dt = Math.min(100, t - last); last = t;
  if (!manual) update(t, dt);
}

// ---------------------------------------------------------------- picking
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let down = null, hot = null;
canvas.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 5) return;
  const r = canvas.getBoundingClientRect();
  ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hits = ray.intersectObjects(parts.map(n => objs[n].mesh).filter(m => m.visible && objs[m.userData.name].state !== 'ctx'), false);
  if (hits.length) showPick(hits[0].object.userData.name); else hidePick();
});
function showPick(n) {
  const o = objs[n]; hot = n; styleAll();
  $('pick-name').textContent = o.info[0];
  $('pick-file').textContent = o.info[2] === 'bought' ? 'bought part, shown as its size allowance' : base(n) + '.stl';
  $('pick-info').textContent = o.info[4];
  $('pick-sw').style.background = o.info[1];
  $('pick-sw').className = 'sw' + (o.info[2] === 'bought' ? ' bought' : '');
  $('pick').hidden = false;
  document.querySelectorAll('.prow').forEach(r => r.classList.toggle('hot', r.dataset.name === n));
}
function hidePick() { hot = null; $('pick').hidden = true; styleAll(); document.querySelectorAll('.prow').forEach(r => r.classList.remove('hot')); }
$('pick-x').onclick = hidePick;

// ---------------------------------------------------------------- legend
const off = new Set();
function legendOn(n) { return !off.has(n); }
function buildLegend() {
  const L = $('legend'); L.innerHTML = '';
  const intro = document.createElement('p'); intro.className = 'note';
  intro.textContent = 'Colours follow the print colour: green shell (shades vary so neighbouring parts read apart), white parts white, the inside parts dark green, the lock grey. Striped swatches are bought parts, drawn at the size the CAD leaves for them. Untick a part to hide it.';
  L.append(intro);
  for (const g of Object.keys(G)) {
    const sec = document.createElement('div');
    const h = document.createElement('h4'); h.textContent = G[g]; sec.append(h);
    for (const n of parts.filter(n => objs[n].info[2] === g && !COPY[n])) {
      const o = objs[n], row = document.createElement('label');
      row.className = 'prow'; row.dataset.name = n;
      const sw = document.createElement('span'); sw.className = 'sw' + (g === 'bought' ? ' bought' : ''); sw.style.background = o.info[1];
      const nm = document.createElement('span'); nm.className = 'nm';
      const k = copiesOf(n).filter(c => objs[c]).length;
      nm.textContent = o.info[0] + (k > 1 ? ` ×${k}` : '');
      const sm = document.createElement('small'); sm.textContent = g === 'bought' ? 'bought' : n + '.stl'; nm.append(sm);
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true; cb.id = 'show-' + n;
      cb.setAttribute('aria-label', 'Show ' + o.info[0]);
      cb.onchange = () => { const names = copiesOf(n); names.forEach(x => cb.checked ? off.delete(x) : off.add(x)); styleAll(); };
      row.append(sw, nm, cb);
      row.addEventListener('mouseenter', () => { hot = n; styleAll(); });
      row.addEventListener('mouseleave', () => { if ($('pick').hidden) { hot = null; styleAll(); } });
      sec.append(row);
    }
    L.append(sec);
  }
}

// ---------------------------------------------------------------- step text
function buildStepList() {
  const L = $('steplist'); L.innerHTML = ''; let last = '';
  STEPS.forEach((s, i) => {
    if (s.stage !== last) { const d = document.createElement('div'); d.className = 'grp'; d.textContent = s.stage; L.append(d); last = s.stage; }
    const b = document.createElement('button');
    b.innerHTML = `<span class="n">${String(s.n).padStart(2, '0')}</span><span></span>`;
    b.lastChild.textContent = s.title;
    b.onclick = () => { step = i; setMode('steps', true); };
    L.append(b);
  });
}
function renderStepText() {
  const s = STEPS[step];
  $('count').textContent = `Step ${s.n} of ${STEPS[STEPS.length - 1].n}`;
  $('prev').disabled = step === 0; $('next').disabled = step === STEPS.length - 1;
  $('s-stage').textContent = s.stage; $('s-title').textContent = `${s.n} · ${s.title}`;
  const ol = $('s-body'); ol.innerHTML = '';
  s.body.forEach(t => { const li = document.createElement('li'); li.textContent = t; ol.append(li); });
  const hw = $('s-hw'); hw.innerHTML = '';
  s.hw.forEach(t => { const sp = document.createElement('span'); sp.textContent = t; hw.append(sp); });
  const np = $('s-parts'); np.innerHTML = '<h4>In this step</h4>';
  [...new Set(s.parts.map(base))].forEach(n => {
    const o = objs[n]; if (!o) return;
    const row = document.createElement('div'); row.className = 'prow'; row.tabIndex = 0; row.dataset.name = n;
    row.innerHTML = '<span class="sw"></span><span class="nm"></span><span></span>';
    row.firstChild.style.background = o.info[1]; if (o.info[2] === 'bought') row.firstChild.classList.add('bought');
    const k = s.parts.filter(c => base(c) === n).length;
    row.children[1].textContent = o.info[0] + (k > 1 ? ` ×${k}` : '');
    row.onclick = () => showPick(n); row.onkeydown = e => { if (e.key === 'Enter') showPick(n); };
    np.append(row);
  });
  $('s-ref').textContent = `Build guide, step ${s.n}`;
  document.querySelectorAll('#steplist button').forEach((b, i) => {
    if (i === step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}

// ---------------------------------------------------------------- controls
function setMode(m, resetCam) {
  mode = m;
  for (const [id, v] of [['m-steps','steps'],['m-explode','explode'],['m-built','built']]) $(id).setAttribute('aria-pressed', String(m === v));
  $('explode-box').hidden = m !== 'explode';
  spin = 0;
  if (m !== 'steps') hidePick();
  apply(resetCam);
}
$('m-steps').onclick = () => { setMode('steps', true); selectTab('step'); };
$('m-explode').onclick = () => setMode('explode', true);
$('m-built').onclick = () => setMode('built', true);
$('explode').oninput = e => { spread = e.target.value / 100; if (mode === 'explode') { for (const n of parts) objs[n].target = spread; } };
$('explode').onchange = () => frame(parts, spread);
$('prev').onclick = () => { if (step > 0) { step--; setMode('steps', true); } };
$('next').onclick = () => { if (step < STEPS.length - 1) { step++; setMode('steps', true); } };
canvas.addEventListener('keydown', e => { if (e.key === 'ArrowRight') $('next').click(); if (e.key === 'ArrowLeft') $('prev').click(); });
function selectTab(t) {
  $('t-step').setAttribute('aria-selected', String(t === 'step')); $('t-parts').setAttribute('aria-selected', String(t === 'parts'));
  $('p-step').hidden = t !== 'step'; $('p-parts').hidden = t !== 'parts';
}
$('t-step').onclick = () => selectTab('step');
$('t-parts').onclick = () => selectTab('parts');

// ---------------------------------------------------------------- script hooks (cad/make_videos.py drives the page with these)
window.viewer = {
  ready: false,
  steps: STEPS.map(s => ({ n: s.n, stage: s.stage, title: s.title, body: s.body, hw: s.hw })),
  parts: () => parts.slice(),
  groups: { LOCK, CAPS, CAPFLOOR, LID, FRONT_BELL, REAR_BELL, HANDLE, CART, LANTERN },
  go(i) { step = i; setMode('steps', true); },                        // jump to step index i
  mode(m) { setMode(m, true); },                                      // 'steps' | 'explode' | 'built'
  spread(k, reframe = false) { spread = k; $('explode').value = Math.round(k * 100); if (mode !== 'explode') setMode('explode', false);
    for (const n of parts) objs[n].target = k; if (reframe) frame(parts, k); },
  pose(map, hide = [], reframe = false) { pose = map || {}; poseHide = new Set(hide); mode = 'pose'; apply(false); if (reframe) frame(parts.filter(n => !poseHide.has(n)), 0); },
  view(dir, names = null, k = 0, zoom = 1) { frame(names || parts.filter(n => objs[n].mesh.visible), k, { parts: [], view: dir });
    if (camTo && zoom !== 1) camTo.pos.sub(camTo.tgt).divideScalar(zoom).add(camTo.tgt); },
  jump() { if (camTo) { camera.position.copy(camTo.pos); controls.target.copy(camTo.tgt); camTo = null; } },
  spin(degPerSec) { spin = degPerSec; },
  manual(on = true) { manual = on; vnow = performance.now(); },       // stop the real-time clock
  tick(ms) { vnow += ms; update(vnow, ms); },                         // advance the manual clock and render one frame
};
})();

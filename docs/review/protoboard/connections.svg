<svg xmlns="http://www.w3.org/2000/svg" width="1330" height="1230" viewBox="0 0 1330 1230"><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif"><text x="42" y="45" font-size="29" fill="#263649" text-anchor="start" >CABLE CONNECTIONS AND COLOUR KEY</text><text x="42" y="85" font-size="19" fill="#263649" text-anchor="start" >Dashed leads on the solder-side drawing. Attach to the rear copper pads.</text><text x="48" y="135" font-size="18" fill="#263649" text-anchor="start" >H01</text><text x="130" y="135" font-size="18" fill="#263649" text-anchor="start" >N01</text><text x="230" y="135" font-size="18" fill="#b96500" text-anchor="start" >S1 switched output</text><text x="48" y="173" font-size="18" fill="#263649" text-anchor="start" >H02</text><text x="130" y="173" font-size="18" fill="#263649" text-anchor="start" >N02</text><text x="230" y="173" font-size="18" fill="#334155" text-anchor="start" >Battery negative / J1 sleeve</text><text x="48" y="211" font-size="18" fill="#263649" text-anchor="start" >H03</text><text x="130" y="211" font-size="18" fill="#263649" text-anchor="start" >O01</text><text x="230" y="211" font-size="18" fill="#b96500" text-anchor="start" >Buck IN+</text><text x="48" y="249" font-size="18" fill="#263649" text-anchor="start" >H04</text><text x="130" y="249" font-size="18" fill="#263649" text-anchor="start" >O02</text><text x="230" y="249" font-size="18" fill="#334155" text-anchor="start" >Buck IN−</text><text x="48" y="287" font-size="18" fill="#263649" text-anchor="start" >H05</text><text x="130" y="287" font-size="18" fill="#263649" text-anchor="start" >P01</text><text x="230" y="287" font-size="18" fill="#d12b36" text-anchor="start" >Buck OUT+ (set to 5.0 V)</text><text x="48" y="325" font-size="18" fill="#263649" text-anchor="start" >H06</text><text x="130" y="325" font-size="18" fill="#263649" text-anchor="start" >P02</text><text x="230" y="325" font-size="18" fill="#334155" text-anchor="start" >Buck OUT−</text><text x="48" y="363" font-size="18" fill="#263649" text-anchor="start" >H07</text><text x="130" y="363" font-size="18" fill="#263649" text-anchor="start" >R01</text><text x="230" y="363" font-size="18" fill="#b96500" text-anchor="start" >Pump + / D2 striped end</text><text x="48" y="401" font-size="18" fill="#263649" text-anchor="start" >H08</text><text x="130" y="401" font-size="18" fill="#263649" text-anchor="start" >R02</text><text x="230" y="401" font-size="18" fill="#146c79" text-anchor="start" >Pump − / D2 unstriped end</text><text x="48" y="439" font-size="18" fill="#263649" text-anchor="start" >H09</text><text x="130" y="439" font-size="18" fill="#263649" text-anchor="start" >S01</text><text x="230" y="439" font-size="18" fill="#b96500" text-anchor="start" >LED + (JST SM)</text><text x="48" y="477" font-size="18" fill="#263649" text-anchor="start" >H10</text><text x="130" y="477" font-size="18" fill="#263649" text-anchor="start" >S02</text><text x="230" y="477" font-size="18" fill="#a63261" text-anchor="start" >LED − (JST SM)</text><text x="48" y="515" font-size="18" fill="#263649" text-anchor="start" >H11</text><text x="130" y="515" font-size="18" fill="#263649" text-anchor="start" >U08</text><text x="230" y="515" font-size="18" fill="#d12b36" text-anchor="start" >Lock +5 V: A3144 pin 1 / C4</text><text x="48" y="553" font-size="18" fill="#263649" text-anchor="start" >H12</text><text x="130" y="553" font-size="18" fill="#263649" text-anchor="start" >V08</text><text x="230" y="553" font-size="18" fill="#419626" text-anchor="start" >Lock HALL: A3144 pin 3</text><text x="48" y="591" font-size="18" fill="#263649" text-anchor="start" >H13</text><text x="130" y="591" font-size="18" fill="#263649" text-anchor="start" >W08</text><text x="230" y="591" font-size="18" fill="#b660a0" text-anchor="start" >Lock SW: microswitch NO</text><text x="48" y="629" font-size="18" fill="#263649" text-anchor="start" >H14</text><text x="130" y="629" font-size="18" fill="#263649" text-anchor="start" >X08</text><text x="230" y="629" font-size="18" fill="#334155" text-anchor="start" >Lock GND: Hall pin 2 / COM / C4</text><text x="42" y="705" font-size="23" fill="#263649" text-anchor="start" >OFF-BOARD CONNECTIONS</text><text x="42" y="744" font-size="17" fill="#263649" text-anchor="start" >Battery + → J1 centre and S1 input. S1 output → H01. Battery − → J1 sleeve and H02.</text><text x="42" y="772" font-size="17" fill="#263649" text-anchor="start" >Leave J1 switched contact unused. Set the buck output to 5.0 V before connecting H05/H06.</text><text x="42" y="800" font-size="17" fill="#263649" text-anchor="start" >D2 NTE586 across pump terminals: stripe to pump +. C4 0.1 µF across A3144 pins 1–2.</text><text x="42" y="828" font-size="17" fill="#263649" text-anchor="start" >A3144: printed face toward you, leads down; pins 1/2/3 = +5V/GND/HALL.</text><text x="42" y="856" font-size="17" fill="#263649" text-anchor="start" >Twist switch COM → GND, NO → SW; NC unused. Lock cable uses the JST PH pair.</text><text x="42" y="884" font-size="17" fill="#263649" text-anchor="start" >JP1: fit shunt for battery operation; remove for USB and follow build-guide power procedure.</text><text x="42" y="965" font-size="16" fill="#b96500" text-anchor="start" >● Switched battery</text><text x="42" y="1003" font-size="16" fill="#334155" text-anchor="start" >● Ground</text><text x="42" y="1041" font-size="16" fill="#d12b36" text-anchor="start" >● Regulated 5 V</text><text x="42" y="1079" font-size="16" fill="#db546b" text-anchor="start" >● D1 → JP1</text><text x="360" y="965" font-size="16" fill="#b31845" text-anchor="start" >● JP1 → XIAO 5V</text><text x="360" y="1003" font-size="16" fill="#8d36b7" text-anchor="start" >● 3.3 V</text><text x="360" y="1041" font-size="16" fill="#19826b" text-anchor="start" >● Battery sense</text><text x="360" y="1079" font-size="16" fill="#419626" text-anchor="start" >● Hall signal</text><text x="678" y="965" font-size="16" fill="#9a3b92" text-anchor="start" >● Twist GPIO</text><text x="678" y="1003" font-size="16" fill="#b660a0" text-anchor="start" >● Switch contact</text><text x="678" y="1041" font-size="16" fill="#1763c0" text-anchor="start" >● Pump PWM</text><text x="678" y="1079" font-size="16" fill="#2887a6" text-anchor="start" >● LED PWM</text><text x="996" y="965" font-size="16" fill="#9e5819" text-anchor="start" >● Pump gate</text><text x="996" y="1003" font-size="16" fill="#75621a" text-anchor="start" >● LED gate</text><text x="996" y="1041" font-size="16" fill="#146c79" text-anchor="start" >● Pump return</text><text x="996" y="1079" font-size="16" fill="#a63261" text-anchor="start" >● LED return</text><text x="42" y="1165" font-size="17" fill="#263649" text-anchor="start" >Cable H02 is an identifier, not a pad: it attaches to N02. Pad H02 is C2 positive.</text></g></svg>